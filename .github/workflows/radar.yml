name: Radar Affiches
on:
  schedule:
    - cron: "17 6,9,12,15,18,21 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: radar
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Releve + detection + notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m radar.run
      - name: Sauvegarde de l'historique
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs/data.json
          git diff --staged --quiet || (git commit -m "releve $(date -u +%F\ %H:%M)" && git push)
